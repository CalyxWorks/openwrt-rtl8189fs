name: Build Alternative RTL8189FS for OpenWrt 6.18.57

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build utilities
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev dwarves xz-utils curl

      - name: Install matching Arm GCC
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel1/arm-gnu-toolchain-15.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"

          curl -fL --retry 3 "$URL" \
            -o "$RUNNER_TEMP/arm-gcc.tar.xz"
          mkdir -p "$RUNNER_TEMP/arm-gcc"
          tar -xJf "$RUNNER_TEMP/arm-gcc.tar.xz" \
            -C "$RUNNER_TEMP/arm-gcc" --strip-components=1

          echo "$RUNNER_TEMP/arm-gcc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/arm-gcc/bin/aarch64-none-linux-gnu-gcc" \
            --version

      - name: Download alternative driver source
        shell: bash
        run: |
          set -euxo pipefail
          DRIVER="$RUNNER_TEMP/driver/rtl8189fs-armbian"
          mkdir -p "$DRIVER"

          curl -fL --retry 3 \
            "https://github.com/gustiarto/rtl8189fs-armbian/archive/refs/heads/main.tar.gz" \
            -o "$RUNNER_TEMP/rtl8189fs-armbian.tar.gz"

          tar -xzf "$RUNNER_TEMP/rtl8189fs-armbian.tar.gz" \
            --strip-components=1 -C "$DRIVER"

          test -f "$DRIVER/Makefile"
          test -f "$DRIVER/os_dep/linux/ioctl_cfg80211.c"

          sed -i \
            's/^CONFIG_IPS_MODE[[:space:]]*=.*/CONFIG_IPS_MODE = 0/' \
            "$DRIVER/Makefile"

          grep -n -E 'CONFIG_POWER_SAVING|CONFIG_IPS_MODE' \
            "$DRIVER/Makefile"

          echo "DRIVER=$DRIVER" >> "$GITHUB_ENV"

      - name: Extract kernel headers
        shell: bash
        run: |
          set -euxo pipefail

          test -s header-6.18.57-ophub.tar.gz

          mkdir -p "$RUNNER_TEMP/headers"
          tar -xzf header-6.18.57-ophub.tar.gz \
            -C "$RUNNER_TEMP/headers"

          SYMVERS="$(find "$RUNNER_TEMP/headers" \
            -type f -name Module.symvers -print -quit)"
          test -n "$SYMVERS"

          HDR="$(dirname "$SYMVERS")"

          test -f "$HDR/Makefile"
          test -f "$HDR/include/config/auto.conf"
          test -f "$HDR/include/generated/utsrelease.h"
          test -x "$HDR/scripts/mod/modpost"

          echo "HDR=$HDR" >> "$GITHUB_ENV"

          echo "=== Kernel release ==="
          cat "$HDR/include/generated/utsrelease.h"

      - name: Rebuild fixdep for GitHub runner
        shell: bash
        run: |
          set -euxo pipefail

          cat > "$RUNNER_TEMP/xalloc.h" <<'EOF'
          #ifndef XALLOC_H
          #define XALLOC_H
          #include <stdlib.h>
          #include <stdio.h>
          static inline void *xmalloc(size_t size)
          {
              void *p = malloc(size);
              if (!p) {
                  perror("fixdep: malloc");
                  exit(1);
              }
              return p;
          }
          #endif
          EOF

          gcc -O2 -I "$RUNNER_TEMP" \
            -o "$HDR/scripts/basic/fixdep" \
            "$HDR/scripts/basic/fixdep.c"

          file "$HDR/scripts/basic/fixdep"
          file "$HDR/scripts/mod/modpost"

      - name: Build kernel module
        shell: bash
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-none-linux-gnu-

          cd "$DRIVER"

          make -j2 ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KSRC="$HDR" \
            KVER=6.18.57-ophub \
            2>&1 | tee "$RUNNER_TEMP/driver-build.log"

          MODULE="$(find "$DRIVER" -type f \
            -name 8189fs.ko -print -quit)"
          test -n "$MODULE"
          test -s "$MODULE"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$MODULE" "$GITHUB_WORKSPACE/output/8189fs.ko"

          sha256sum "$GITHUB_WORKSPACE/output/8189fs.ko"
          file "$GITHUB_WORKSPACE/output/8189fs.ko"

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alternative-driver-build-log
          path: ${{ runner.temp }}/driver-build.log
          if-no-files-found: warn

      - name: Upload module artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8189fs-armbian-openwrt-6.18.57
          path: output/8189fs.ko
          if-no-files-found: error
          retention-days: 14
