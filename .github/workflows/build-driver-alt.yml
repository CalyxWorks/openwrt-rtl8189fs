name: Build Alternative RTL8189FS Driver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CROSS_COMPILE: aarch64-none-linux-gnu-

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev dwarves \
            xz-utils curl tar

      - name: Download ARM GNU cross-compiler
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel1/arm-gnu-toolchain-15.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"

          curl -fL "$URL" -o "$RUNNER_TEMP/arm-toolchain.tar.xz"
          mkdir -p "$RUNNER_TEMP/toolchain"
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" \
            -C "$RUNNER_TEMP/toolchain" --strip-components=1

          echo "$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/toolchain/bin/aarch64-none-linux-gnu-gcc" --version

      - name: Extract kernel headers into a clean directory
        shell: bash
        run: |
          set -euxo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/header-6.18.57-ophub.tar.gz"
          HDR="$RUNNER_TEMP/headers"

          test -f "$ARCHIVE"
          rm -rf "$HDR"
          mkdir -p "$HDR"

          tar -xzf "$ARCHIVE" -C "$HDR"

          test -f "$HDR/Makefile"
          test -f "$HDR/Module.symvers"
          test -f "$HDR/include/generated/autoconf.h"

          echo "=== Header tree ==="
          ls -ld "$HDR"
          ls -l "$HDR/scripts/mod" || true

      - name: Prepare kernel build utilities
        shell: bash
        run: |
          set -euxo pipefail
          HDR="$RUNNER_TEMP/headers"
          export ARCH=arm64
          export CROSS_COMPILE="$CROSS_COMPILE"

          if [ ! -x "$HDR/scripts/mod/modpost" ]; then
            make -C "$HDR" \
              ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" scripts
          fi

          test -x "$HDR/scripts/mod/modpost"

      - name: Download alternative RTL8189FS source
        shell: bash
        run: |
          set -euxo pipefail
          DRIVER="$RUNNER_TEMP/driver/rtl8189fs-armbian"
          rm -rf "$DRIVER"
          mkdir -p "$DRIVER"

          curl -fL \
            "https://github.com/gustiarto/rtl8189fs-armbian/archive/refs/heads/main.tar.gz" \
            -o "$RUNNER_TEMP/rtl8189fs-armbian.tar.gz"

          tar -xzf "$RUNNER_TEMP/rtl8189fs-armbian.tar.gz" \
            --strip-components=1 -C "$DRIVER"

          test -f "$DRIVER/Makefile"
          test -f "$DRIVER/os_dep/linux/ioctl_cfg80211.c"

          sed -i \
            's/^CONFIG_IPS_MODE[[:space:]]*=.*/CONFIG_IPS_MODE = 0/' \
            "$DRIVER/Makefile"

          grep -n -E 'CONFIG_POWER_SAVING|CONFIG_IPS_MODE' \
            "$DRIVER/Makefile"

      - name: Build alternative driver
        shell: bash
        run: |
          set -euxo pipefail
          HDR="$RUNNER_TEMP/headers"
          DRIVER="$RUNNER_TEMP/driver/rtl8189fs-armbian"

          export ARCH
