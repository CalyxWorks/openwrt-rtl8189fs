name: Build RTL8189FS for OpenWrt 6.18.57

on:
  workflow_dispatch:
    inputs:
      audit_only:
        description: "Audit source and cfg80211 compatibility only; do not compile"
        required: true
        type: boolean
        default: true
  push:
    paths:
      - "build-driver.yml"
      - "kernel-6.18.57.config"
      - "header-6.18.57-ophub.tar.gz"
      - ".github/workflows/build-driver.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check uploaded inputs
        shell: bash
        run: |
          set -euxo pipefail
          test -s kernel-6.18.57.config
          test -s header-6.18.57-ophub.tar.gz
          sha256sum kernel-6.18.57.config header-6.18.57-ophub.tar.gz

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex \
            libssl-dev libelf-dev dwarves xz-utils

      - name: Install matching Arm GCC
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel1/arm-gnu-toolchain-15.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/arm-gcc.tar.xz"
          mkdir -p "$RUNNER_TEMP/arm-gcc"
          tar -xJf "$RUNNER_TEMP/arm-gcc.tar.xz" \
            -C "$RUNNER_TEMP/arm-gcc" --strip-components=1
          echo "$RUNNER_TEMP/arm-gcc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/arm-gcc/bin/aarch64-none-linux-gnu-gcc" --version

      - name: Download pinned jwrdegoede RTL8189FS source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/driver" "$RUNNER_TEMP/headers"

          SOURCE_COMMIT="876e627a5b6a8021700391b4249a4a31edfebe5c"
          SOURCE_URL="https://github.com/jwrdegoede/rtl8189ES_linux/archive/${SOURCE_COMMIT}.tar.gz"

          curl -fL --retry 3 "$SOURCE_URL" \
            -o "$RUNNER_TEMP/rtl8189fs-source.tar.gz"

          echo "===== SOURCE ARCHIVE CHECKSUM ====="
          sha256sum "$RUNNER_TEMP/rtl8189fs-source.tar.gz"

          tar -xzf "$RUNNER_TEMP/rtl8189fs-source.tar.gz" \
            -C "$RUNNER_TEMP/driver"

          DRIVER_FILE="$(find "$RUNNER_TEMP/driver" -type f \
            -path '*/os_dep/linux/ioctl_cfg80211.c' -print -quit)"

          if [ -z "$DRIVER_FILE" ]; then
            echo "ERROR: Could not find os_dep/linux/ioctl_cfg80211.c"
            echo "===== EXTRACTED SOURCE FILES ====="
            find "$RUNNER_TEMP/driver" -maxdepth 4 -type f | head -200
            exit 1
          fi

          DRIVER="$(dirname "$(dirname "$(dirname "$DRIVER_FILE")")")"
          test -f "$DRIVER/Makefile"

          echo "DRIVER=$DRIVER" >> "$GITHUB_ENV"

          echo "===== DRIVER SOURCE ====="
          echo "$DRIVER"
          echo "Pinned commit: $SOURCE_COMMIT"

          echo "===== DRIVER CONFIGURATION SETTINGS ====="
          grep -n -E \
            'CONFIG_(IPS_MODE|POWER_SAVING|LPS|FW|WOWLAN)|IPS_MODE|POWER_SAVING' \
            "$DRIVER/Makefile" "$DRIVER/include" \
            --include='Makefile' --include='*.h' 2>/dev/null || true

          echo "===== DRIVER BUILD OPTIONS ====="
          sed -n '1,240p' "$DRIVER/Makefile"

          echo "===== SOURCE VERSION GUARDS ====="
          grep -R -n -E \
            --include='*.c' --include='*.h' \
            'KERNEL_VERSION\((6|7),[[:space:]]*[0-9]+,[[:space:]]*[0-9]+\)' \
            "$DRIVER/os_dep/linux" | head -240 || true

      - name: Extract kernel headers
        shell: bash
        run: |
          set -euxo pipefail
          tar -xzf header-6.18.57-ophub.tar.gz \
            -C "$RUNNER_TEMP/headers"

          SYMVERS="$(find "$RUNNER_TEMP/headers" \
            -type f -name Module.symvers -print -quit)"
          test -n "$SYMVERS"
          HDR="$(dirname "$SYMVERS")"

          test -f "$HDR/Makefile"
          test -f "$HDR/include/config/auto.conf"
          test -f "$HDR/include/generated/utsrelease.h"
          test -x "$HDR/scripts/mod/modpost"

          echo "HDR=$HDR" >> "$GITHUB_ENV"

          echo "===== KERNEL RELEASE ====="
          cat "$HDR/include/generated/utsrelease.h"

          echo "===== HEADER TREE ====="
          ls -lh "$HDR/Module.symvers" "$HDR/Makefile"

      - name: Rebuild fixdep for GitHub runner
        shell: bash
        run: |
          set -euxo pipefail

          cat > "$RUNNER_TEMP/xalloc.h" <<'EOF'
          #ifndef XALLOC_H
          #define XALLOC_H
          #include <stdlib.h>
          #include <stdio.h>
          static inline void *xmalloc(size_t size)
          {
              void *p = malloc(size);
              if (!p) {
                  perror("fixdep: malloc");
                  exit(1);
              }
              return p;
          }
          #endif
          EOF

          gcc -O2 -I "$RUNNER_TEMP" \
            -o "$HDR/scripts/basic/fixdep" \
            "$HDR/scripts/basic/fixdep.c"

          echo "===== HOST TOOL FORMATS ====="
          file "$HDR/scripts/basic/fixdep"
          file "$HDR/scripts/mod/modpost"

      - name: Audit cfg80211 compatibility across driver
        shell: bash
        run: |
          set -eu
          SRC="$DRIVER"
          FILE="$SRC/os_dep/linux/ioctl_cfg80211.c"

          echo "===== ALL 7.1.0 GUARDS IN DRIVER ====="
          grep -R -n -B 5 -A 10 \
            --include='*.c' --include='*.h' \
            'KERNEL_VERSION(7, 1, 0)' "$SRC" || true

          echo "===== OTHER RELEVANT VERSION GUARDS ====="
          grep -R -n -E \
            --include='*.c' --include='*.h' \
            'KERNEL_VERSION\((6|7),[[:space:]]*[0-9]+,[[:space:]]*[0-9]+\)' \
            "$SRC/os_dep/linux" | head -240 || true

          echo "===== STATION CALLBACK DEFINITIONS ====="
          grep -n -B 8 -A 24 -E \
            'cfg80211_rtw_(get_station|add_station|del_station|change_station|dump_station)\(' \
            "$FILE" || true

          echo "===== REMAIN-ON-CHANNEL AND MGMT-TX DEFINITIONS ====="
          grep -n -B 8 -A 35 -E \
            'cfg80211_rtw_(remain_on_channel|cancel_remain_on_channel|mgmt_tx)\(' \
            "$FILE" || true

          echo "===== POWER-SAVING SYMBOLS IN SOURCE ====="
          grep -RniE \
            'CONFIG_POWER_SAVING|CONFIG_IPS_MODE|RTW_IPS_MODE|IPS_MODE|power.?saving' \
            "$SRC" --include='Makefile' --include='*.mk' --include='*.h' \
            --include='*.c' | head -n 100 || true

          echo "===== CFG80211 OPS INITIALIZER ====="
          grep -n -B 12 -A 90 -E \
            'static const struct cfg80211_ops|struct cfg80211_ops' \
            "$FILE" | tail -180 || true

          echo "===== STATION NOTIFICATION CALLS ====="
          grep -R -n -B 6 -A 8 -E \
            'cfg80211_(new_sta|del_sta)\(' "$SRC" || true

            echo "===== PUBLIC MGMT-TX CALLBACK ====="
            
          grep -n -B 12 -A 75 \
            'static .*cfg80211_rtw_mgmt_tx' \
            "$FILE" || true
          
          echo "===== REMAIN-ON-CHANNEL CALLBACK REGISTRATION ====="
          grep -n -B 8 -A 12 -E \
            '\.remain_on_channel|\.cancel_remain_on_channel|\.mgmt_tx' \
            "$FILE" || true
          
          echo "===== POWER-SAVING MAKEFILE RULES ====="
          sed -n '45,75p' "$SRC/Makefile"
          grep -n -B 5 -A 12 -E \
            'CONFIG_POWER_SAVING|CONFIG_IPS_MODE|CONFIG_LPS_MODE' \
            "$SRC/Makefile"

      - name: Diagnose actual cfg80211 header API
        shell: bash
        run: |
          set -eu

          echo "===== HEADER KERNEL VERSION ====="
          grep -R -n 'LINUX_VERSION_CODE' \
            "$HDR/include/generated" "$HDR/include/linux" \
            2>/dev/null | head -30 || true

          echo "===== CFG80211 CALLBACK SIGNATURES ====="
          grep -n -B 4 -A 8 -E \
            '\(\*(get_station|add_station|del_station|change_station|dump_station|remain_on_channel|cancel_remain_on_channel|mgmt_tx)\)' \
            "$HDR/include/net/cfg80211.h" || true

          echo "===== RELEVANT HEADER STRUCTS AND PROTOTYPES ====="
          grep -n -B 5 -A 10 -E \
            'struct cfg80211_ops|struct station_parameters|cfg80211_new_sta\(|cfg80211_del_sta\(' \
            "$HDR/include/net/cfg80211.h" || true

          echo "===== DRIVER VERSION GUARDS AND CALLBACK REFERENCES ====="
          grep -n -E \
            'KERNEL_VERSION\(7, 1, 0\)|KERNEL_VERSION\(7, 2, 0\)|KERNEL_VERSION\(7, 3, 0\)|cfg80211_rtw_(get_station|add_station|del_station|change_station|dump_station|remain_on_channel|cancel_remain_on_channel|mgmt_tx)' \
            "$DRIVER/os_dep/linux/ioctl_cfg80211.c" | tail -140 || true

      - name: Build kernel module
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.audit_only != true }}
        shell: bash
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-none-linux-gnu-

          cd "$DRIVER"

          make -j2 ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            KSRC="$HDR" KVER=6.18.57-ophub \
            2>&1 | tee "$RUNNER_TEMP/driver-build.log"

          echo "===== BUILT MODULES ====="
          find "$DRIVER" -type f -name '*.ko' -print

          MODULE="$(find "$DRIVER" -type f \
            -name 8189fs.ko -print -quit)"
          test -n "$MODULE"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$MODULE" "$GITHUB_WORKSPACE/output/8189fs.ko"

          echo "===== MODULE CHECKSUM AND FORMAT ====="
          sha256sum "$GITHUB_WORKSPACE/output/8189fs.ko"
          file "$GITHUB_WORKSPACE/output/8189fs.ko"

          echo "===== MODULE METADATA ====="
          modinfo "$GITHUB_WORKSPACE/output/8189fs.ko" || true

      - name: Save compiler error log
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.audit_only != true) }}
        uses: actions/upload-artifact@v4
        with:
          name: pinned-driver-build-log
          path: ${{ runner.temp }}/driver-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload module artifact
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.audit_only != true) }}
        uses: actions/upload-artifact@v4
        with:
          name: rtl8189fs-pinned-openwrt-6.18.57
          path: output/8189fs.ko
          if-no-files-found: error
          retention-days: 14
