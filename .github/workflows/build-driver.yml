
name: Build RTL8189FS for OpenWrt 6.18.57

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-driver.yml"
      - "kernel-6.18.57.config"
      - "header-6.18.57-ophub.tar.gz"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      KERNEL_RELEASE: 6.18.57-ophub
      DRIVER_REPO: https://github.com/gustiarto/rtl8189fs-armbian.git
      DRIVER_REF: main

    steps:
      - name: Check out build inputs
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev dwarves \
            xz-utils zstd curl git python3 \
            file binutils

      - name: Install ARM GNU Toolchain
        run: |
          set -euxo pipefail
          URL="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel1/arm-gnu-toolchain-15.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
          curl --fail --location --retry 3 "$URL" \
            -o "$RUNNER_TEMP/arm-toolchain.tar.xz"

          sudo mkdir -p /opt/arm-toolchain
          sudo tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" \
            --strip-components=1 -C /opt/arm-toolchain

          echo "/opt/arm-toolchain/bin" >> "$GITHUB_PATH"
          /opt/arm-toolchain/bin/aarch64-none-linux-gnu-gcc --version

      - name: Validate repository inputs
        run: |
          set -euxo pipefail
          test -s header-6.18.57-ophub.tar.gz
          test -s kernel-6.18.57.config
          sha256sum header-6.18.57-ophub.tar.gz \
            kernel-6.18.57.config

      - name: Extract and validate kernel headers
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/kernel-headers"
          tar -xf header-6.18.57-ophub.tar.gz \
            -C "$RUNNER_TEMP/kernel-headers"

          SYMVERS="$(find "$RUNNER_TEMP/kernel-headers" \
            -type f -name Module.symvers -print -quit)"
          test -n "$SYMVERS"
          HDR="$(dirname "$SYMVERS")"

          echo "HDR=$HDR" >> "$GITHUB_ENV"
          test -s "$HDR/Makefile"
          test -s "$HDR/include/config/auto.conf"
          test -s "$HDR/include/generated/utsrelease.h"
          test -s "$HDR/scripts/mod/modpost.c"
          test -s "$HDR/scripts/mod/Makefile"
          test -s "$HDR/scripts/basic/fixdep.c"

          RELEASE="$(sed -n \
            's/^#define UTS_RELEASE "\(.*\)"/\1/p' \
            "$HDR/include/generated/utsrelease.h")"

          echo "Header release: $RELEASE"
          test "$RELEASE" = "$KERNEL_RELEASE"

          echo "=== Module.symvers ==="
          wc -l "$HDR/Module.symvers"
          sha256sum "$HDR/Module.symvers"

          echo "=== Relevant configuration ==="
          grep -E \
            '^(CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_CFG80211|CONFIG_MAC80211)=' \
            "$HDR/include/config/auto.conf" || true

          echo "=== Callback declarations ==="
          grep -n -A 9 -B 2 -E \
            '\(\*(add_key|get_key|del_key|set_default_mgmt_key|get_station|add_station|del_station|change_station|dump_station|remain_on_channel|mgmt_tx)\)' \
            "$HDR/include/net/cfg80211.h" || true


      - name: Rebuild host tools natively
        shell: bash
        run: |
          set -euxo pipefail
          cd "$HDR"

          # Supply the matching kernel configuration.
          cp "$GITHUB_WORKSPACE/kernel-6.18.57.config" .config

          # Explicitly select the target architecture. Without this,
          # Kbuild defaults to x86 and looks for arch/x86/Makefile.
          make ARCH=arm64 olddefconfig

          # Rebuild host executables for the GitHub runner.
          rm -f scripts/mod/modpost
          rm -f scripts/basic/fixdep

          make ARCH=arm64 -j2 \
            HOSTCC=gcc HOSTLD=gcc \
            scripts/mod/modpost scripts/basic/fixdep

          echo "=== modpost architecture ==="
          file scripts/mod/modpost
          readelf -h scripts/mod/modpost | grep -E 'Class:|Machine:'

          echo "=== fixdep architecture ==="
          file scripts/basic/fixdep
          readelf -h scripts/basic/fixdep | grep -E 'Class:|Machine:'


      - name: Fetch driver source and record identity
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch "$DRIVER_REF" \
            "$DRIVER_REPO" "$RUNNER_TEMP/driver"

          DRIVER="$RUNNER_TEMP/driver"
          echo "DRIVER=$DRIVER" >> "$GITHUB_ENV"

          git -C "$DRIVER" rev-parse HEAD |
            tee "$RUNNER_TEMP/source-commit.txt"

          test -s "$DRIVER/Makefile"
          test -s "$DRIVER/os_dep/linux/ioctl_cfg80211.c"

          mkdir -p output
          cp "$RUNNER_TEMP/source-commit.txt" output/

      - name: Apply verified kernel compatibility changes
        shell: bash
        run: |
          set -euxo pipefail

          python3 - "$DRIVER/os_dep/linux/ioctl_cfg80211.c" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          # The scan-tested tree moved these branches from 7.1
          # to 6.18. Apply only if the expected old marker exists.
          old = "KERNEL_VERSION(7, 1, 0)"
          new = "KERNEL_VERSION(6, 18, 0)"

          if old in text:
              text = text.replace(old, new)
              print("Updated 7.1 callback thresholds to 6.18.")
          elif new in text:
              print("6.18 callback thresholds already present.")
          else:
              raise SystemExit(
                  "STOP: expected callback version markers not found"
              )

          # Require exactly one definition for each changed callback.
          for name in (
              "cfg80211_rtw_add_key",
              "cfg80211_rtw_get_key",
              "cfg80211_rtw_del_key",
              "cfg80211_rtw_set_default_mgmt_key",
              "cfg80211_rtw_get_station",
              "cfg80211_rtw_add_station",
              "cfg80211_rtw_del_station",
              "cfg80211_rtw_change_station",
              "cfg80211_rtw_dump_station",
              "cfg80211_rtw_remain_on_channel",
              "cfg80211_rtw_mgmt_tx",
          ):
              count = text.count(name + "(")
              if count == 0:
                  raise SystemExit(
                      f"STOP: callback not found: {name}"
                  )

          # Adapt cookie signatures and uses only within the two
          # callback function bodies. Refuse unexpected source.
          def function_bounds(source, name):
              marker = name + "("
              pos = source.find(marker)
              if pos < 0:
                  raise SystemExit(f"Missing {name}")
              start = source.rfind("static ", 0, pos)
              if start < 0:
                  raise SystemExit(f"Cannot locate declaration {name}")
              brace = source.find("{", pos)
              if brace < 0:
                  raise SystemExit(f"Cannot locate body {name}")
              depth = 0
              for i in range(brace, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              raise SystemExit(f"Unclosed body {name}")

          def patch_callback(name, transform):
              global text
              start, end = function_bounds(text, name)
              original = text[start:end]
              updated = transform(original)
              if updated != original:
                  text = text[:start] + updated + text[end:]
                  print(f"Patched {name}")
              else:
                  print(f"No change needed: {name}")

          def patch_roc(fn):
              if "u64 *cookie" in fn:
                  fn = fn.replace("u64 *cookie", "u64 cookie", 1)
              if "u64 cookie" not in fn:
                  raise SystemExit("Unexpected remain_on_channel cookie")
              if "const u8 *rx_addr" not in fn:
                  fn = fn.replace(
                      "u64 cookie",
                      "u64 cookie, const u8 *rx_addr",
                      1,
                  )
              fn = fn.replace(
                  "*cookie = ATOMIC_INC_RETURN("
                  " &pcfg80211_wdinfo->ro_ch_cookie_gen);",
                  "/* Cookie supplied by cfg80211. */",
              )
              fn = fn.replace(
                  "*cookie = ATOMIC_INC_RETURN("
                  " &pcfg80211_wdinfo->ro_ch_cookie_gen ) ;",
                  "/* Cookie supplied by cfg80211. */",
              )
              fn = fn.replace("*cookie", "cookie")
              if "(void)rx_addr;" not in fn:
                  fn = fn.replace(
                      "{", "{\n\t(void)rx_addr;\n", 1
                  )
              return fn

          def patch_mgmt(fn):
              if "u64 *cookie" in fn:
                  fn = fn.replace("u64 *cookie", "u64 cookie", 1)
              if "u64 cookie" not in fn:
                  raise SystemExit("Unexpected mgmt_tx cookie signature")
              fn = fn.replace(
                  "*cookie = pwdev_priv->mgmt_tx_cookie++;",
                  "/* Cookie supplied by cfg80211. */",
              )
              fn = fn.replace("*cookie", "cookie")
              return fn

          patch_callback("cfg80211_rtw_remain_on_channel", patch_roc)
          patch_callback("cfg80211_rtw_mgmt_tx", patch_mgmt)

          path.write_text(text)
          PY

          echo "=== Patched callback signatures ==="
          grep -n -A 8 -E \
            'cfg80211_rtw_(add_key|get_key|del_key|set_default_mgmt_key|get_station|add_station|del_station|change_station|dump_station|remain_on_channel|mgmt_tx)\(' \
            "$DRIVER/os_dep/linux/ioctl_cfg80211.c"

      - name: Configure conservative driver settings
        shell: bash
        run: |
          set -euxo pipefail
          cd "$DRIVER"

          # Preserve the scan-tested IPS setting.
          python3 - Makefile <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          def set_value(key, value):
              global text
              pattern = re.compile(
                  r"(?m)^" + re.escape(key) + r"\s*=.*$"
              )
              text, count = pattern.subn(
                  f"{key} = {value}", text
              )
              if count != 1:
                  raise SystemExit(
                      f"STOP: expected one Makefile setting for {key}; "
                      f"found {count}"
                  )

          set_value("CONFIG_POWER_SAVING", "y")
          set_value("CONFIG_IPS_MODE", "0")
          set_value("CONFIG_LPS_MODE", "default")
          set_value("CONFIG_USB_AUTOSUSPEND", "n")
          set_value("CONFIG_HW_PWRP_DETECTION", "n")
          set_value("CONFIG_RTW_NAPI", "n")
          set_value("CONFIG_RTW_GRO", "n")
          set_value("CONFIG_RTW_DEBUG", "y")
          set_value("CONFIG_RTW_SDIO_PM_KEEP_POWER", "y")

          path.write_text(text)
          PY

          grep -E \
            '^(CONFIG_POWER_SAVING|CONFIG_IPS_MODE|CONFIG_LPS_MODE|CONFIG_USB_AUTOSUSPEND|CONFIG_HW_PWRP_DETECTION|CONFIG_RTW_NAPI|CONFIG_RTW_GRO|CONFIG_RTW_DEBUG|CONFIG_RTW_SDIO_PM_KEEP_POWER)[[:space:]]*=' \
            Makefile

      - name: Build module
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p output
          {
            echo "UTC build time: $(date -u +%FT%TZ)"
            echo "Kernel release: $KERNEL_RELEASE"
            echo "Driver repository: $DRIVER_REPO"
            echo "Driver ref: $DRIVER_REF"
            echo "Driver commit:"
            cat output/source-commit.txt
            echo "Header archive checksum:"
            sha256sum header-6.18.57-ophub.tar.gz
            echo "Kernel Module.symvers checksum:"
            sha256sum "$HDR/Module.symvers"
            echo "Compiler:"
            aarch64-none-linux-gnu-gcc --version
          } | tee output/build-metadata.txt

          cd "$DRIVER"
          make clean

          make -j2 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            KSRC="$HDR" \
            KVER="$KERNEL_RELEASE" \
            2>&1 | tee "$GITHUB_WORKSPACE/output/driver-build.log"

          KO="$(find . -type f -name 8189fs.ko -print -quit)"
          test -n "$KO"
          install -m 0644 "$KO" \
            "$GITHUB_WORKSPACE/output/8189fs.ko"

      - name: Verify module metadata
        shell: bash
        run: |
          set -euxo pipefail
          KO="$GITHUB_WORKSPACE/output/8189fs.ko"

          file "$KO"
          /opt/arm-toolchain/bin/aarch64-none-linux-gnu-readelf \
            -h "$KO"

          STRINGS="$(strings "$KO")"
          printf '%s\n' "$STRINGS" |
            grep -F "vermagic=$KERNEL_RELEASE "

          printf '%s\n' "$STRINGS" |
            grep -F 'sdio:c*v024CdF179*'

          printf '%s\n' "$STRINGS" |
            grep -E 'depends=|license=|alias=' || true

          sha256sum "$KO" | tee output/module.sha256
          sha256sum "$HDR/Module.symvers" \
            >> output/build-metadata.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8189fs-openwrt-6.18.57-ophub
          if-no-files-found: warn
          path: |
            output/8189fs.ko
            output/driver-build.log
            output/build-metadata.txt
            output/source-commit.txt
            output/module.sha256
