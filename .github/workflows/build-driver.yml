
name: Build RTL8189FS for OpenWrt 6.18.57

on:
  workflow_dispatch:
  push:
    paths:
      - "build-driver.yml"
      - "kernel-6.18.57.config"
      - "rtl8189fs-6.18.57-test.tar.gz"
      - "header-6.18.57-ophub.tar.gz"
      - ".github/workflows/build-driver.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check uploaded inputs
        shell: bash
        run: |
          set -euxo pipefail
          test -s kernel-6.18.57.config
          test -s rtl8189fs-6.18.57-test.tar.gz
          test -s header-6.18.57-ophub.tar.gz
          sha256sum kernel-6.18.57.config \
            rtl8189fs-6.18.57-test.tar.gz \
            header-6.18.57-ophub.tar.gz

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex \
            libssl-dev libelf-dev dwarves xz-utils

      - name: Install matching Arm GCC
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel1/arm-gnu-toolchain-15.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/arm-gcc.tar.xz"
          mkdir -p "$RUNNER_TEMP/arm-gcc"
          tar -xJf "$RUNNER_TEMP/arm-gcc.tar.xz" \
            -C "$RUNNER_TEMP/arm-gcc" --strip-components=1
          echo "$RUNNER_TEMP/arm-gcc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/arm-gcc/bin/aarch64-none-linux-gnu-gcc" \
            --version

      - name: Extract driver and kernel headers
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/driver" "$RUNNER_TEMP/headers"
          tar -xzf rtl8189fs-6.18.57-test.tar.gz \
            -C "$RUNNER_TEMP/driver"
          tar -xzf header-6.18.57-ophub.tar.gz \
            -C "$RUNNER_TEMP/headers"

          DRIVER="$RUNNER_TEMP/driver/rtl8189fs-6.18.57-test"
          test -f "$DRIVER/Makefile"
          echo "DRIVER=$DRIVER" >> "$GITHUB_ENV"

          SYMVERS="$(find "$RUNNER_TEMP/headers" \
            -type f -name Module.symvers -print -quit)"
          test -n "$SYMVERS"
          HDR="$(dirname "$SYMVERS")"

          test -f "$HDR/Makefile"
          test -f "$HDR/include/config/auto.conf"
          test -f "$HDR/include/generated/utsrelease.h"
          test -x "$HDR/scripts/mod/modpost"

          echo "HDR=$HDR" >> "$GITHUB_ENV"
          echo "===== KERNEL RELEASE ====="
          cat "$HDR/include/generated/utsrelease.h"
          echo "===== HEADER TREE ====="
          ls -lh "$HDR/Module.symvers" "$HDR/Makefile"

      - name: Build kernel module
        shell: bash
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-none-linux-gnu-

          cd "$DRIVER"
          make -j2 ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            KSRC="$HDR" KVER=6.18.57-ophub

          echo "===== BUILT MODULES ====="
          find "$DRIVER" -type f -name '*.ko' -print
          MODULE="$(find "$DRIVER" -type f \
            -name 8189fs.ko -print -quit)"
          test -n "$MODULE"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$MODULE" "$GITHUB_WORKSPACE/output/8189fs.ko"
          sha256sum "$GITHUB_WORKSPACE/output/8189fs.ko"
          file "$GITHUB_WORKSPACE/output/8189fs.ko"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8189fs-openwrt-6.18.57-ophub
          path: output/8189fs.ko
          if-no-files-found: error
          retention-days: 14
